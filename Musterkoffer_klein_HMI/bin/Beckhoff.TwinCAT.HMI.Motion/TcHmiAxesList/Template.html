<div class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-Template tchmi-box">
    <div class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-menu-bar">
        <div
            id="{Id}_ColumnChooserButton"
            class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-column-chooser-button"
            data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiButton"
            data-tchmi-tooltip="%l%Control::TcHmi.Controls.Beckhoff.TcHmiMotion.TcHmiAxesList::ColumnChooser_Button_Tooltip%/l%"
            data-tchmi-width-unit="px"
            data-tchmi-height="30"
            data-tchmi-height-unit="px"
        ></div>
    </div>
    <div class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-grid-container">
        <div id="{Id}_Datagrid" data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiDatagrid">
            <script data-tchmi-target-attribute="data-tchmi-content-padding" type="application/json">
                {
                    "top": 3,
                    "right": 3,
                    "bottom": 3,
                    "left": 3
                }
            </script>
            <script data-tchmi-target-attribute="data-tchmi-cell-content-padding" type="application/json">
                {
                    "top": 0,
                    "topUnit": "px",
                    "right": 3,
                    "rightUnit": "px",
                    "bottom": 0,
                    "bottomUnit": "px",
                    "left": 3,
                    "leftUnit": "px"
                }
            </script>
        </div>
    </div>
    <div class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-control-bar">
        <div
            id="{Id}_BackwardsFastButton"
            class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-control-button"
            data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiButton"
            data-tchmi-text="--"
            data-tchmi-text-font-size="27"
            data-tchmi-width-unit="px"
            data-tchmi-height="55"
            data-tchmi-height-unit="px"
        ></div>
        <div
            id="{Id}_BackwardsSlowButton"
            class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-control-button"
            data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiButton"
            data-tchmi-text="-"
            data-tchmi-text-font-size="27"
            data-tchmi-width-unit="px"
            data-tchmi-height="55"
            data-tchmi-height-unit="px"
        ></div>
        <div
            id="{Id}_ForwardsSlowButton"
            class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-control-button"
            data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiButton"
            data-tchmi-text="+"
            data-tchmi-text-font-size="20"
            data-tchmi-width-unit="px"
            data-tchmi-height="55"
            data-tchmi-height-unit="px"
        ></div>
        <div
            id="{Id}_ForwardsFastButton"
            class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-control-button"
            data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiButton"
            data-tchmi-text="++"
            data-tchmi-text-font-size="20"
            data-tchmi-width-unit="px"
            data-tchmi-height="55"
            data-tchmi-height-unit="px"
        ></div>
        <div
            id="{Id}_ResetButton"
            class="TcHmi_Controls_Beckhoff_TcHmiMotion_TcHmiAxesList-control-button"
            data-tchmi-type="TcHmi.Controls.Beckhoff.TcHmiButton"
            data-tchmi-text="Reset"
            data-tchmi-width-unit="px"
            data-tchmi-height="55"
            data-tchmi-height-unit="px"
        ></div>
    </div>
</div>
